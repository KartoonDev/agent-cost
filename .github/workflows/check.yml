name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: compile
        run: python -m py_compile scripts/*.py
      - name: no personal data files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(ledger[^/]*\.jsonl|[^/]*\.jsonl\.bak-[^/]*|pricing\.json|\.ide_sync\.json|\.ledger\.lock|[0-9]{4}-[0-9]{2}\.md)$' || true)
          if [ -n "$bad" ]; then echo "ห้าม commit ไฟล์ข้อมูลส่วนตัว:"; echo "$bad"; exit 1; fi
      - name: smoke test
        run: |
          export AGENT_COST_DIR="$RUNNER_TEMP/ac"
          mkdir -p "$AGENT_COST_DIR"
          echo '{"session_id":"ci","transcript_path":"/nonexistent","cwd":"/tmp"}' | python scripts/capture.py
          python scripts/report.py --month 2026-09 >/dev/null
          python scripts/ide_sync.py --dry-run
